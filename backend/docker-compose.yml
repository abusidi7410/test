version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techhub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - techhub
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: techhub-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - techhub
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: techhub-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-techhub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-techhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - techhub

  redis:
    image: redis:7-alpine
    container_name: techhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - techhub

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techhub-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - techhub
    depends_on:
      - app
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techhub-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
    networks:
      - techhub
    depends_on:
      - app
      - mysql
      - redis

volumes:
  mysql-data:
  redis-data:

networks:
  techhub:
    driver: bridge
